plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'maven-publish'
}

android {
    lintOptions {
        abortOnError false
    }
    namespace 'com.vuukle.sdk'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        multiDexEnabled true
        buildConfigField "String", "LIBRARY_VERSION", "\"1.0.13\""
        // Sentry DSN: read from VUUKLE_SENTRY_DSN gradle prop or env var. Empty = no telemetry.
        buildConfigField "String", "SENTRY_DSN", "\"" + (project.findProperty("VUUKLE_SENTRY_DSN") ?: System.getenv("VUUKLE_SENTRY_DSN") ?: "") + "\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    // Facebook
    implementation 'com.facebook.android:facebook-login:12.0.0'
    implementation 'com.facebook.android:facebook-share:12.0.0'

    implementation 'androidx.multidex:multidex:2.0.1'

    // Crash + error telemetry to Sentry. Off by default - publishers can opt
    // in by setting VUUKLE_SENTRY_DSN in their gradle.properties or letting
    // it default to the empty string (no-op).
    implementation 'io.sentry:sentry-android:7.14.0'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.github.vuukle'
                artifactId = 'android-widgets-vuukle'
                version = '1.0.13'
            }
        }
    }
}