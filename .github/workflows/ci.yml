name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}

      - name: Build SDK library (Release AAR)
        run: ./gradlew :sdk:assembleRelease --no-daemon --console=plain

      - name: Build sample app (Debug APK)
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Run unit tests
        run: ./gradlew :sdk:testReleaseUnitTest --no-daemon --console=plain

      - name: Lint
        run: ./gradlew :sdk:lintRelease --no-daemon --console=plain || true

      - name: Upload SDK AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: vuukle-sdk-aar
          path: sdk/build/outputs/aar/*.aar

      - name: Upload sample APK
        uses: actions/upload-artifact@v4
        with:
          name: sample-app-apk
          path: app/build/outputs/apk/debug/*.apk
